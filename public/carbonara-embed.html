<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>spagwhetti :: carbonara embed</title>
    <base target="_parent">
    <style>
        :root {
            --primary: #ffffff;
            --secondary: #000000;
        }

        html {
            padding: 0;
            margin: 0;
        }

        body {
            overflow: hidden;
            padding: 0;
            margin: 0;
        }

        #image {
            width: 100%;
            aspect-ratio: 1 / 1;
        }

        #overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            color: var(--secondary);
            background: var(--primary);
            border: 1px solid var(--secondary);
            font-family: Helvetica, sans-serif;
            font-size: 0.8rem;
            text-decoration: none;
            padding: 2px;
            &:hover {
                color: var(--primary);
                background: var(--secondary);
            }
        }
    </style>
</head>
<body>
    <a id="link" href="">
        <img id="image" src="">
    </a>
    <a id="overlay" href="https://spaghetti.nekoweb.org/carbonara">carbonara</a>
    <script type="text/javascript" src="js/carbonara.js"></script>
</body>
</html>
